<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manhwa Studio">
<title>MI MANHWA STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bangers&family=Comic+Neue:wght@700&family=Noto+Sans+KR:wght@700;900&family=Anton&family=Bebas+Neue&family=Permanent+Marker&family=Black+Han+Sans&family=Montserrat:wght@900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<style>
:root{
  --bg:#121212; --s1:#1a1a1e; --s2:#222227; --s3:#2b2b31; --line:#33333b;
  --text:#ececf1; --muted:#9c9cab; --dim:#6d6d7a;
  --neon:#b44dff; --neon2:#8b3dff; --neon-soft:rgba(180,77,255,.14); --glow:0 0 0 1px rgba(180,77,255,.55),0 0 18px rgba(180,77,255,.35);
  --ok:#3ddc97; --warn:#ffb547; --bad:#ff5d7a; --info:#4cc9f0;
  --r:14px; --side:252px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--neon)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0 0 8px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:12px}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:var(--side);flex:none;background:#0d0d10;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:14px 12px 30px;display:flex;flex-direction:column;gap:4px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:800;font-size:17px;letter-spacing:.02em;cursor:pointer}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--neon),#5b21b6);display:grid;place-items:center;box-shadow:var(--glow);font-size:18px}
.navsec{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none;cursor:pointer;font-weight:500;min-height:42px;border:1px solid transparent}
.nav:hover{background:var(--s1)}
.nav.on{background:var(--neon-soft);border-color:rgba(180,77,255,.35);color:#e9d5ff}
.nav .ic{width:22px;text-align:center}
.curm{margin:6px 4px 2px;padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.curm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;background:rgba(18,18,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 18px}
#menuBtn{display:none}
.searchbox{flex:1;max-width:520px;position:relative}
.searchbox input{width:100%;padding-left:38px}
.searchbox span{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warn);animation:pulse 1s infinite} .sync.err i{background:var(--bad)}
#view{padding:22px 22px 80px;max-width:1280px;width:100%;margin:0 auto}
@keyframes pulse{50%{opacity:.35}}
#scrim{display:none}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px #000}
  body.menu #side{transform:none}
  body.menu #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35}
  #menuBtn{display:inline-flex}
  #view{padding:16px 12px 90px}
  .sync span{display:none}
  h1{font-size:22px}
}

/* ---------- controls ---------- */
button,.btn{font:inherit;font-weight:600;color:var(--text);background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:10px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s,box-shadow .15s}
button:hover:not(:disabled),.btn:hover{border-color:var(--neon)}
button:disabled{opacity:.45;cursor:not-allowed}
.pri{background:linear-gradient(135deg,var(--neon),var(--neon2));border-color:transparent;color:#fff;box-shadow:0 4px 18px rgba(139,61,255,.35)}
.pri:hover:not(:disabled){box-shadow:var(--glow);border-color:transparent}
.big{min-height:54px;font-size:16px;padding:12px 22px;border-radius:14px}
.ghost{background:transparent}
.danger{color:#ffb3c0;border-color:rgba(255,93,122,.35)}
.danger:hover:not(:disabled){border-color:var(--bad);background:rgba(255,93,122,.1)}
.ok{color:#b9f6dc;border-color:rgba(61,220,151,.4)}
.ok:hover:not(:disabled){border-color:var(--ok);background:rgba(61,220,151,.1)}
.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.icon{min-width:44px;padding:8px}
.sm.icon{min-width:34px}
input,select,textarea{font:inherit;color:var(--text);background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(180,77,255,.18)}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--neon)}
input[type=range]{padding:0;min-height:30px;accent-color:var(--neon);background:transparent;border:0}
input[type=color]{padding:4px;width:54px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
label.f>span{display:flex;justify-content:space-between;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.nw{flex-wrap:nowrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.hov{cursor:pointer;transition:border-color .15s,transform .15s}
.card.hov:hover{border-color:rgba(180,77,255,.6);transform:translateY(-1px)}
.panelbox{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.sect{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:4px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--s3);color:var(--muted);border:1px solid var(--line)}
.chip.neon{background:var(--neon-soft);color:#dcb8ff;border-color:rgba(180,77,255,.35)}
.chip.ok{background:rgba(61,220,151,.12);color:var(--ok);border-color:rgba(61,220,151,.3)}
.chip.warn{background:rgba(255,181,71,.12);color:var(--warn);border-color:rgba(255,181,71,.3)}
.chip.bad{background:rgba(255,93,122,.12);color:var(--bad);border-color:rgba(255,93,122,.3)}
.chip.info{background:rgba(76,201,240,.12);color:var(--info);border-color:rgba(76,201,240,.3)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{background:transparent;border:1px solid transparent;color:var(--muted);min-height:40px}
.tab.on{background:var(--neon-soft);color:#e9d5ff;border-color:rgba(180,77,255,.35)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.alert{padding:12px 14px;border-radius:12px;border:1px solid;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:rgba(255,181,71,.08);border-color:rgba(255,181,71,.35);color:#ffd9a0}
.alert.bad{background:rgba(255,93,122,.08);border-color:rgba(255,93,122,.35);color:#ffc1cc}
.alert.info{background:rgba(76,201,240,.07);border-color:rgba(76,201,240,.3);color:#bde9f7}
.alert.ok{background:rgba(61,220,151,.07);border-color:rgba(61,220,151,.3);color:#bff3dc}
.bar{height:8px;background:var(--s3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--neon2),var(--neon));border-radius:99px}
hr{border:0;border-top:1px solid var(--line);margin:8px 0}
mark{background:rgba(180,77,255,.35);color:#fff;border-radius:3px;padding:0 2px}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--s3);padding:2px 6px;border-radius:6px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}

/* ---------- manhwa cards ---------- */
.mcard{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,transform .15s}
.mcard:hover{border-color:rgba(180,77,255,.6);transform:translateY(-2px)}
.mcover{aspect-ratio:3/4;background:#0c0c0f center/cover no-repeat;position:relative;display:grid;place-items:center}
.mcover .ini{font-size:52px;font-weight:800;color:rgba(255,255,255,.85);text-shadow:0 0 30px rgba(180,77,255,.8)}
.mcover .arch{position:absolute;top:10px;left:10px}
.mcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.mcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.newcard{border:2px dashed rgba(180,77,255,.5);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:300px;cursor:pointer;color:#dcb8ff;font-weight:700;background:rgba(180,77,255,.04)}
.newcard:hover{background:rgba(180,77,255,.1);box-shadow:var(--glow)}
.newcard .plus{font-size:44px;line-height:1}

/* ---------- entity cards ---------- */
.ecard{display:flex;gap:12px;align-items:flex-start}
.thumb{width:62px;height:62px;border-radius:12px;background:var(--s3) center/cover no-repeat;flex:none;display:grid;place-items:center;font-size:24px}
.ecard h3{font-size:15px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;white-space:pre-wrap}
@media(max-width:600px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--s1);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.wide{max-width:900px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
@media(max-width:600px){.modal-bg{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0;max-height:94vh}.modal .acts button{flex:1}}

#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:#26262c;border:1px solid var(--line);border-left:4px solid var(--neon);padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;animation:tin .2s}
.toast.err{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- script editor ---------- */
.pcard{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:140px 1fr;gap:14px}
.pcard .pimg{width:140px;aspect-ratio:2/3;border-radius:10px;background:var(--s3) center/cover no-repeat;display:grid;place-items:center;color:var(--dim);font-size:12px;text-align:center;padding:6px;cursor:pointer}
.pcard.S .pimg{aspect-ratio:4/3}.pcard.M .pimg{aspect-ratio:1}.pcard.XL .pimg{aspect-ratio:1/2}
@media(max-width:700px){.pcard{grid-template-columns:1fr}.pcard .pimg{width:100%;max-width:240px}}
.pnum{font-weight:800;color:#dcb8ff}
.dl{display:grid;grid-template-columns:130px 120px 1fr 34px;gap:6px;align-items:start}
@media(max-width:700px){.dl{grid-template-columns:1fr 1fr}.dl textarea{grid-column:1/-1}}
.dl textarea{min-height:44px}
.prompt{background:#0e0e12;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#c9b6e6;white-space:pre-wrap;word-break:break-word}
.size-pill{font-weight:800;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--s3)}

/* ---------- builder ---------- */
.builder{display:grid;grid-template-columns:220px minmax(0,1fr) 290px;gap:14px;align-items:start}
@media(max-width:1100px){.builder{grid-template-columns:1fr}}
.strip{display:flex;flex-direction:column;gap:8px;max-height:75vh;overflow:auto;padding-right:4px}
@media(max-width:1100px){.strip{flex-direction:row;max-height:none;overflow-x:auto;padding-bottom:6px}.strip .sitem{width:120px;flex:none}}
.sitem{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:grab;display:flex;flex-direction:column;gap:4px;position:relative}
.sitem.on{border-color:var(--neon);box-shadow:var(--glow)}
.sitem canvas,.sitem .ph{width:100%;border-radius:6px;display:block;background:var(--s3)}
.sitem .n{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);padding:1px 7px;border-radius:6px;font-size:12px;font-weight:700}
.sortable-ghost{opacity:.35}
.stage-wrap{background:#0b0b0e;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:center}
.stage{position:relative;width:100%;max-width:560px;touch-action:none;user-select:none}
.stage canvas{width:100%;display:block;border-radius:4px}
.lbox{position:absolute;border:1.5px dashed rgba(180,77,255,.0);cursor:move;touch-action:none}
.lbox:hover{border-color:rgba(180,77,255,.55)}
.lbox.on{border-color:var(--neon);border-style:solid;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.lbox .hdl{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--neon);border:2px solid #fff;cursor:nwse-resize;display:none}
.lbox .hdl.tl{left:-9px;top:-9px;right:auto;bottom:auto}
.lbox.on .hdl{display:block}
.props{display:flex;flex-direction:column;gap:10px}
.phone{width:390px;max-width:100%;margin:0 auto;border:10px solid #000;border-radius:34px;background:#000;overflow:hidden;box-shadow:0 0 0 2px #333,0 30px 80px rgba(0,0,0,.6)}
.phone .scr{height:76vh;overflow:auto;background:#fff}
.phone .scr canvas{width:100%;display:block}

/* ---------- reader ---------- */
.player{position:sticky;bottom:0;background:rgba(26,26,30,.97);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 40px rgba(0,0,0,.5);z-index:20;margin-top:16px}
.ptext{display:flex;flex-direction:column;gap:2px;max-height:56vh;overflow:auto;padding:6px;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.7}
.ptext .pp{padding:6px 10px;border-radius:8px;cursor:pointer}
.ptext .pp:hover{background:var(--s2)}
.ptext .pp.on{background:var(--neon-soft);box-shadow:inset 3px 0 0 var(--neon)}
.ptext .ph{font-family:Inter,sans-serif;font-weight:800;color:#dcb8ff;font-size:15px;margin-top:14px;padding:6px 10px;text-transform:uppercase;letter-spacing:.06em}
.playbtn{width:60px;height:60px;border-radius:50%;padding:0;font-size:22px}

/* ---------- covers / lora ---------- */
.covers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.covers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.covers canvas{width:100%;border-radius:10px;border:1px solid var(--line);background:#000}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ithumb{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--s3);aspect-ratio:2/3;cursor:pointer}
.ithumb img{width:100%;height:100%;object-fit:cover;display:block}
.ithumb.on{border-color:var(--neon);box-shadow:var(--glow)}
.ithumb .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11px;display:flex;justify-content:space-between;align-items:end;gap:4px}
.ithumb .heart{position:absolute;top:6px;right:6px;min-height:30px;min-width:30px;padding:0;border-radius:50%;background:rgba(0,0,0,.6)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.sheet .slot{border:1px dashed var(--line);border-radius:10px;aspect-ratio:2/3;background:var(--s2) center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:var(--muted);padding:4px;cursor:pointer;position:relative}
.sheet .slot span{background:rgba(0,0,0,.65);padding:2px 6px;border-radius:5px;color:#fff}
.rounds{display:flex;flex-direction:column;gap:14px}
.round{border-left:3px solid var(--neon);padding-left:12px}
.res{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--s2);cursor:pointer}
.res:hover{border-color:var(--neon)}
.idea{display:flex;flex-direction:column;gap:10px}
.idea .acts{display:flex;gap:8px;margin-top:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td input,table.t td select{min-height:38px;padding:6px 9px}
.scrollx{overflow-x:auto}
.login{max-width:420px;margin:30px auto}

.covergrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
@media(max-width:900px){.covergrid{grid-template-columns:1fr}}
.player .row>label.f{flex:1 1 120px;min-width:0}
.player select{min-width:0}
input[type=radio],input[type=checkbox]{width:20px;min-height:20px;height:20px;flex:none;accent-color:var(--neon)}

/* ===== v3: modos, hablar, editor, redes ===== */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 4px}
.modes button{min-height:42px;padding:6px 4px;font-size:11.5px;border-radius:10px;background:var(--s1)}
.modes button.on{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#fff;border-color:transparent;box-shadow:var(--glow)}
.cmdbar{display:flex;gap:8px;align-items:center;background:var(--s1);border:1px solid rgba(180,77,255,.35);border-radius:14px;padding:8px;box-shadow:0 0 22px rgba(180,77,255,.12)}

<script>
'use strict';
/* =====================================================================
   MI MANHWA STUDIO — núcleo: utilidades, almacenamiento, nube, UI base
   ===================================================================== */
const SB_URL = 'https://ggaydgzyjddtnavgqnyw.supabase.co';
const SB_KEY = 'sb_publishable_OiYmE4MTnDGDfYECyZLACw_GJnSyhwp'; // llave pública (segura de mostrar)
const FN_URL = SB_URL + '/functions/v1/studio';
const DEFAULT_MODEL = 'claude-opus-5-5';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ\s]/g, ' ').replace(/\s+/g, ' ').trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtDate = t => t ? new Date(t).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
function lev(a, b) { a = norm(a); b = norm(b); if (a === b) return 0; const m = a.length, n = b.length; if (!m || !n) return Math.max(m, n); let p = Array.from({ length: n + 1 }, (_, i) => i); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function downloadBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
const safeName = s => norm(s).replace(/\s+/g, '_').slice(0, 40) || 'manhwa';

/* ---------------- IndexedDB ---------------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('mi-manhwa-studio', 1);
      r.onupgradeneeded = () => { const d = r.result; ['manhwas', 'images', 'kv'].forEach(s => d.objectStoreNames.contains(s) || d.createObjectStore(s)); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out); t.onerror = () => rej(t.error); }); },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },
  put(store, key, val) { return this.tx(store, 'readwrite', s => s.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  async all(store) { const d = await this.open(); return new Promise((res, rej) => { const out = []; const t = d.transaction(store, 'readonly'); const c = t.objectStore(store).openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); }); }
};

/* ---------------- Estado ---------------- */
const S = {
  manhwas: {},          // id -> manhwa (cada uno con su propio cerebro)
  settings: { aiMode: 'premium', model: DEFAULT_MODEL, spend: {}, falPrices: {}, audioPos: {}, falApp: 'fal-ai/flux-lora', sdxlModel: '', trainApp: 'fal-ai/flux-lora-fast-training', trainSteps: 1000, readerPos: {}, voice: {} },
  user: null, session: null, keyStatus: null,
  showArchived: false,
  sync: 'local'
};
const cur = () => S.manhwas[Route.mid];

/* ---------------- Modelo de datos ---------------- */
function newManhwa(name = 'Nuevo manhwa') {
  const t = Date.now();
  return {
    id: uid('m_'), name, createdAt: t, updatedAt: t, archived: false, coverImg: null,
    bible: { synopsis: '', plot: '', rules: '', genre: '', tone: '', protagonistId: '',
      style: { model: 'Pony', steps: 30, cfg: 7, width: 800, height: 1200, prefix: 'manhwa style, korean webtoon, clean lineart, vibrant colors, cinematic lighting', negative: 'lowres, bad anatomy, bad hands, extra fingers, text, watermark, signature, speech bubble, blurry' } },
    characters: [], places: [], powers: [], objects: [], factions: [], timeline: [],
    canon: [], chapters: [], images: {}, plotIdeas: [], nameBank: [], covers: {}
  };
}
function chapterList(m) { return [...(m.chapters || [])].sort((a, b) => (a.number || 0) - (b.number || 0)); }
function chapterByNum(m, n) { return (m.chapters || []).find(c => Number(c.number) === Number(n)); }

/* ---------------- Guardado local + nube ---------------- */
const dirty = new Set();
const pushSoon = debounce(() => pushDirty(), 1500);
function touch(m) {
  if (!m) return;
  m.updatedAt = Date.now();
  IDB.put('manhwas', m.id, m).catch(e => console.error(e));
  dirty.add(m.id);
  if (S.user) { setSync('busy', 'Guardando…'); pushSoon(); }
}
const saveSoon = debounce(m => touch(m), 500);

async function pushDirty() {
  if (!S.user || !sb) return;
  const ids = [...dirty]; dirty.clear();
  try {
    for (const id of ids) {
      const m = S.manhwas[id];
      if (!m) continue;
      const { error } = await sb.from('manhwas').upsert({ id: m.id, user_id: S.user.id, name: m.name, archived: !!m.archived, deleted: false, data: m, updated_at: new Date(m.updatedAt).toISOString() });
      if (error) throw error;
    }
    // subir imágenes pendientes
    for (const id of ids) { await uploadPendingImages(S.manhwas[id]); await uploadPendingAudios(S.manhwas[id]); await uploadPendingMedia(S.manhwas[id]); }
    setSync('ok', 'Guardado en la nube');
  } catch (e) {
    ids.forEach(i => dirty.add(i));
    setSync('err', 'Sin conexión — se guardará luego');
    console.warn(e);
    setTimeout(pushSoon, 15000);
  }
}
function setSync(state, text) {
  S.sync = state;
  const el = $('#sync'); if (!el) return;
  el.className = 'sync ' + (state === 'local' ? '' : state);
  el.querySelector('span').textContent = text || (S.user ? 'Nube' : 'Solo en este dispositivo');
}
const saveSettings = debounce(async () => {
  try { await IDB.put('kv', 'settings', S.settings); } catch (e) { }
  if (S.user && sb) { try { await sb.from('user_settings').upsert({ user_id: S.user.id, settings: S.settings, updated_at: new Date().toISOString() }); } catch (e) { } }
}, 1200);

async function loadLocal() {
  for (const [id, m] of await IDB.all('manhwas')) S.manhwas[id] = m;
  const st = await IDB.get('kv', 'settings'); if (st) Object.assign(S.settings, st);
}

async function pullCloud() {
  if (!S.user) return;
  setSync('busy', 'Sincronizando…');
  try {
    const { data, error } = await sb.from('manhwas').select('id,name,archived,deleted,data,updated_at');
    if (error) throw error;
    const cloudIds = new Set();
    for (const row of data) {
      cloudIds.add(row.id);
      const local = S.manhwas[row.id];
      const cloudT = new Date(row.updated_at).getTime();
      if (row.deleted) { if (local) { delete S.manhwas[row.id]; await IDB.del('manhwas', row.id); } continue; }
      if (!local || (local.updatedAt || 0) < cloudT) { S.manhwas[row.id] = row.data; await IDB.put('manhwas', row.id, row.data); }
      else if ((local.updatedAt || 0) > cloudT) dirty.add(row.id);
    }
    // locales que no están en la nube -> subir (excepto el ejemplo intacto si la nube ya tiene manhwas)
    for (const m of Object.values(S.manhwas)) {
      if (cloudIds.has(m.id)) continue;
      if (m.sample && !m.sampleTouched && data.length) { delete S.manhwas[m.id]; await IDB.del('manhwas', m.id); continue; }
      dirty.add(m.id);
    }
    const { data: st } = await sb.from('user_settings').select('settings').maybeSingle();
    if (st?.settings) { Object.assign(S.settings, st.settings); S.settings.spend ||= {}; S.settings.falPrices ||= {}; S.settings.audioPos ||= {}; S.settings.aiMode ||= 'premium'; await IDB.put('kv', 'settings', S.settings); if (S.settings.cc?.token && typeof ccStartPolling === 'function') ccStartPolling(); }
    if (dirty.size) await pushDirty(); else setSync('ok', 'Sincronizado');
  } catch (e) { console.warn(e); setSync('err', 'No se pudo sincronizar'); }
}

/* ---------------- Supabase / sesión ---------------- */
let sb = null;
try { sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } }); } catch (e) { console.warn('Supabase no cargó', e); }

async function initAuth() {
  if (!sb) return;
  const { data } = await sb.auth.getSession();
  S.session = data.session; S.user = data.session?.user || null;
  sb.auth.onAuthStateChange((ev, session) => {
    const was = S.user?.id;
    S.session = session; S.user = session?.user || null;
    if (S.user && S.user.id !== was) { pullCloud().then(() => { refreshKeyStatus(); render(); resumeTrainings(); }); }
    if (!S.user) { S.keyStatus = null; setSync('local', 'Solo en este dispositivo'); }
    renderSide();
  });
}
async function callFn(action, payload = {}) {
  if (!S.user) throw new Error('Inicia sesión en Configuración para usar la IA y Fal.ai (tus llaves viven en tu servidor privado).');
  const { data } = await sb.auth.getSession();
  const tok = data.session?.access_token;
  const r = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok, apikey: SB_KEY }, body: JSON.stringify({ action, ...payload }) });
  let j = {}; try { j = await r.json(); } catch (e) { }
  if (!r.ok || j.error) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
async function refreshKeyStatus() { if (!S.user) return; try { S.keyStatus = await callFn('keyStatus'); } catch (e) { S.keyStatus = null; } if (Route.view === 'config') render(); }

/* ---------------- Imágenes ---------------- */
const urlCache = {};
async function blobFromFile(file, maxW = 1600, keepAlpha = false) {
  // trabaja en grande: guarda hasta 1600px de ancho
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) return { blob: file, w: 0, h: 0 };
  let w = bmp.width, h = bmp.height;
  if (w <= maxW && (keepAlpha || file.size < 2.5e6) && /jpe?g|png|webp/.test(file.type)) return { blob: file, w, h };
  if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, keepAlpha ? 'image/png' : 'image/jpeg', 0.92));
  return { blob, w, h };
}
async function addImage(m, file, meta = {}) {
  const { blob, w, h } = await blobFromFile(file, 1600, !!(meta.sticker || meta.png));
  const id = uid('img_');
  await IDB.put('images', id, blob);
  m.images[id] = { id, w, h, type: blob.type, source: meta.source || 'subida', createdAt: Date.now(), path: null, ...meta };
  touch(m);
  return id;
}
async function addRemoteImage(m, info, meta = {}) {
  // imagen generada en Fal.ai ya guardada en tu Storage por la función segura
  const id = uid('img_');
  m.images[id] = { id, w: info.width || 0, h: info.height || 0, type: info.content_type || 'image/jpeg', source: 'fal.ai', createdAt: Date.now(), path: info.path || null, remoteUrl: info.path ? null : info.url, ...meta };
  touch(m);
  return id;
}
async function getImageBlob(m, id) {
  if (!id) return null;
  let b = await IDB.get('images', id).catch(() => null);
  if (b) return b;
  const meta = m?.images?.[id]; if (!meta) return null;
  try {
    if (meta.path && S.user) { const { data, error } = await sb.storage.from('studio').download(meta.path); if (!error && data) b = data; }

  } else if (typeof CC !== 'undefined' && CC.ok && !CC.info?.ask) toast('Actualiza tu puente de Claude Code para que haga esto solo (te mandé el archivo nuevo).');
  if (isPremium()) return premiumAI(full, title);

  }

  if (r.usage) { const M = CLAUDE_MODELS[r.model] || CLAUDE_MODELS[S.settings.model] || CLAUDE_MODELS[DEFAULT_MODEL]; addSpend((r.usage.input_tokens * M.in + r.usage.output_tokens * M.out) / 1e6); }
  return { text: r.text || '', stop: r.stop_reason };
}
function parseJSON(text) {
  let t = String(text).replace(/```(?:json)?/gi, '').trim();
  const a = t.search(/[\[{]/); if (a < 0) throw new Error('La IA no devolvió datos válidos. Intenta de nuevo.');
  const open = t[a], close = open === '[' ? ']' : '}';
  const b = t.lastIndexOf(close);
  const body = t.slice(a, b + 1);
  try { return JSON.parse(body); }
  catch (e) {
    // reparación simple: cortar al último objeto completo
    const cut = body.lastIndexOf('},');
    if (cut > 0) { try { return JSON.parse(body.slice(0, cut + 1) + (open === '[' ? ']' : '}')); } catch (_) { } }
    throw new Error('La IA devolvió un formato incompleto. Intenta de nuevo.');
  }
}
async function aiJSON(prompt, opts = {}) {
  const { text } = await ai(prompt + '\n\nResponde SOLO con JSON válido, sin texto antes ni después.', { temperature: 0.7, ...opts });
  return parseJSON(text);
}
function parseJSONL(text) {
  const out = [];
  for (const line of String(text).split('\n')) { const l = line.trim().replace(/,$/, ''); if (!l.startsWith('{')) continue; try { out.push(JSON.parse(l)); } catch (e) { } }
  return out;
}

/* Contexto del cerebro de UN manhwa (nunca mezcla otros) */
function brain(m, { maxChars = 50000, skipChapterId = null } = {}) {
  const L = [];
  const b = m.bible || {};
  L.push(`MANHWA: ${m.name}`);
  if (b.genre) L.push(`Género: ${b.genre}`); if (b.tone) L.push(`Tono: ${b.tone}`);
  if (b.synopsis) L.push(`Sinopsis: ${b.synopsis}`);
  if (b.plot) L.push(`Trama completa: ${b.plot}`);
  if (b.rules) L.push(`Reglas del mundo: ${b.rules}`);
  if (b.extras) L.push(`Apuntes del autor:\n${String(b.extras).slice(0, 15000)}`);
  for (const s of b.sections || []) if (s.text) L.push(`\n## ${String(s.title).toUpperCase()}\n${String(s.text).slice(0, 6000)}`);
  const ent = (title, arr, fn) => { if (arr?.length) { L.push(`\n## ${title}`); arr.forEach(x => L.push('- ' + fn(x))); } };
  const nm = id => findEntity(m, id)?.name || '?';
  ent('PERSONAJES', m.characters, c => [c.name, c.nickname && `apodo "${c.nickname}"`, c.age && `${c.age} años`, c.role, c.status && `estado: ${c.status}`, c.power && `poder: ${c.power}`, c.weakness && `debilidad: ${c.weakness}`, c.trauma && `trauma: ${c.trauma}`, c.goal && `objetivo: ${c.goal}`, c.appearance && `apariencia: ${c.appearance}`, (c.relations || []).length && 'relaciones: ' + c.relations.map(r => `${r.kind} de ${nm(r.target)}`).join(', ')].filter(Boolean).join(' · '));
  ent('LUGARES', m.places, p => [p.name, p.kind, p.description, p.climate && `clima: ${p.climate}`, p.inhabitants && `habitantes: ${p.inhabitants}`, p.rules && `reglas: ${p.rules}`].filter(Boolean).join(' · '));
  ent('PODERES Y SISTEMA', m.powers, p => [p.name, p.kind, p.description, p.ranks && `rangos: ${p.ranks}`, p.cost && `costo: ${p.cost}`].filter(Boolean).join(' · '));
  ent('OBJETOS', m.objects, p => [p.name, p.kind, p.description, p.owner && `dueño: ${p.owner}`].filter(Boolean).join(' · '));
  ent('FACCIONES Y GREMIOS', m.factions, p => [p.name, p.kind, p.description, p.leader && `líder: ${p.leader}`].filter(Boolean).join(' · '));
  ent('LÍNEA DE TIEMPO', [...(m.timeline || [])].sort((a, b) => (a.order || 0) - (b.order || 0)), t => `${t.when}: ${t.name}${t.description ? ' — ' + t.description : ''}`);
  ent('FICHAS CANON (hechos fijos)', m.canon, f => `${f.entity} · ${f.attribute} · ${f.value}${f.since ? ' · desde Cap ' + f.since : ''}${f.note ? ' (' + f.note + ')' : ''}`);
  const caps = chapterList(m).filter(c => c.id !== skipChapterId && (c.summary || c.premise));
  if (caps.length) { L.push('\n## CAPÍTULOS ANTERIORES'); caps.forEach(c => L.push(`- Cap ${c.number} "${c.title || ''}": ${c.summary || c.premise}`)); }
  let s = L.join('\n');
  if (s.length > maxChars) s = s.slice(0, maxChars) + '\n…(recortado)';
  return s;
}
function findEntity(m, id) { for (const k of Object.keys(TYPES)) { const e = (m[TYPES[k].key] || []).find(x => x.id === id); if (e) return e; } return null; }
function findEntityType(m, id) { for (const k of Object.keys(TYPES)) if ((m[TYPES[k].key] || []).some(x => x.id === id)) return k; return null; }

/* Detector de repetidos */
function findDuplicates(m, name, selfId) {
  const n = norm(name); if (!n) return [];
  const out = [];
  for (const [k, T] of Object.entries(TYPES)) for (const x of m[T.key] || []) {
    if (x.id === selfId || !x.name) continue;
    const d = lev(x.name, name);
    if (norm(x.name) === n) out.push({ k, x, exact: true });
    else if (n.length >= 4 && d <= 1) out.push({ k, x, exact: false });
  }
  return out;
}
ACT.saveEntity = async el => {
  const m = cur(); const t = el.dataset.t; const T = TYPES[t]; const d = window._formDraft;
  if (!d.name || !d.name.trim()) return toast('El nombre es obligatorio', 'err');
  d.name = d.name.trim();
  const dupes = findDuplicates(m, d.name, el.dataset.id || null);
  if (dupes.length) {
    const x = dupes[0]; const caps = chaptersMentioning(m, x.x.name);
    const where = caps.length ? ` en el Cap ${caps[0]}` : '';
    const msg = x.exact ? `Oye, ya tienes un ${TYPES[x.k].one} que se llama <b>${esc(x.x.name)}</b>${where}. ¿Quieres usar ese o crear uno nuevo con otro nombre?`
      : `Ojo: <b>${esc(d.name)}</b> se parece mucho a <b>${esc(x.x.name)}</b> (${TYPES[x.k].one}${where}). ¿Es el mismo?`;
    const r = await choiceBox('🔁 Posible repetido', msg, [{ label: 'Usar el existente', value: 'use' }, { label: 'Cambiar el nombre', value: 'rename' }, { label: 'Crear de todos modos', value: 'force', cls: 'danger' }]);
    if (r === 'use') return go(mlink(m, 'wiki', x.k, x.x.id));
    if (r !== 'force') return;
  }
  const arr = m[T.key];
  let isNew = false;
  if (el.dataset.id) { const i = arr.findIndex(x => x.id === el.dataset.id); arr[i] = { ...arr[i], ...d }; }
  else { d.id = uid(t.slice(0, 1) + '_'); d.createdAt = Date.now(); d.relations = d.relations || []; arr.push(d); isNew = true; }
  if (m.sample) m.sampleTouched = true;
  touch(m); toast('Guardado ✔', 'ok');
  const id = el.dataset.id || d.id;
  go(mlink(m, 'wiki', t, id));
  if (isNew) setTimeout(() => ACT.connect({ dataset: { id } }, null, true), 250);
};
ACT.delEntity = async el => {
  const m = cur(); const T = TYPES[el.dataset.t]; const e = m[T.key].find(x => x.id === el.dataset.id);
  if (!await confirmBox(`¿Seguro que quieres borrar ${T.one === 'facción' ? 'la' : 'el'} ${T.one} <b>${esc(e.name)}</b>?`)) return;
  m[T.key] = m[T.key].filter(x => x.id !== e.id);
  for (const k of Object.keys(TYPES)) for (const x of m[TYPES[k].key] || []) x.relations = (x.relations || []).filter(r => r.target !== e.id);
  touch(m); toast('Borrado'); go(mlink(m, 'wiki', el.dataset.t));
};
/* Conexiones */
ACT.connect = (el, ev, asNew) => {
  const m = cur(); const e = findEntity(m, el.dataset.id); if (!e) return;
  const rel = clone(e.relations || []);
  const all = []; for (const [k, T] of Object.entries(TYPES)) for (const x of m[T.key] || []) if (x.id !== e.id) all.push({ k, x });
  if (!all.length) return;
  const bg = modal(`<h2>🔗 ¿Con quién se conecta ${esc(e.name)}?</h2><p class="muted small">${asNew ? 'Acabas de crear algo nuevo. ' : ''}Marca las conexiones (amigo, enemigo, enamorado, vive en…).</p>
    <div class="col" style="max-height:52vh;overflow:auto">${all.map(({ k, x }) => { const r = rel.find(r => r.target === x.id); return `<div class="row nw"><input type="checkbox" data-t="${x.id}" ${r ? 'checked' : ''}><span class="grow small">${TYPES[k].icon} ${esc(x.name)}</span><select data-k="${x.id}" style="width:140px;min-height:38px;padding:6px">${REL_KINDS.map(o => `<option ${r && r.kind === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`; }).join('')}</div>
    <div class="acts"><button data-x="no">${asNew ? 'Ahora no' : 'Cancelar'}</button><button class="pri" data-x="ok">Guardar conexiones</button></div>`);
  bg.querySelector('[data-x=no]').onclick = () => bg.close();
  bg.querySelector('[data-x=ok]').onclick = () => {
    e.relations = $$('input[data-t]', bg).filter(i => i.checked).map(i => ({ target: i.dataset.t, kind: bg.querySelector(`select[data-k="${i.dataset.t}"]`).value, note: (rel.find(r => r.target === i.dataset.t) || {}).note || '' }));
    touch(m); bg.close(); render(); toast('Conexiones guardadas', 'ok');
  };
};

VIEWS.buscar = () => {
  const q = Route.a || ''; const nq = norm(q);
  $('#gsearch').value = q;
  if (!nq) return `<div class="empty">Escribe algo en el buscador.</div>`;
  const snip = (txt) => { const s = String(txt || ''); const i = norm(s).indexOf(nq); if (i < 0) return esc(s.slice(0, 120)); const a = Math.max(0, i - 50); return (a ? '…' : '') + esc(s.slice(a, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length, i + q.length + 70)) + '…'; };
  const groups = [];
  for (const m of Object.values(S.manhwas)) {
    const hits = [];
    if (norm(m.name).includes(nq)) hits.push({ to: mlink(m, 'biblia'), label: '🧠 Nombre del manhwa', s: snip(m.name) });
    for (const f of ['synopsis', 'plot', 'rules']) if (norm(m.bible[f]).includes(nq)) hits.push({ to: mlink(m, 'biblia'), label: '🧠 Biblia', s: snip(m.bible[f]) });
    for (const [k, T] of Object.entries(TYPES)) for (const e of m[T.key] || []) {
      const fld = T.fields.find(([f]) => norm(e[f]).includes(nq));
      if (fld) hits.push({ to: mlink(m, 'wiki', k, e.id), label: `${T.icon} ${T.one[0].toUpperCase() + T.one.slice(1)}: <b>${esc(e.name)}</b>`, s: fld[0] === 'name' ? '' : `${esc(fld[1])}: ${snip(e[fld[0]])}` });
    }
    for (const c of chapterList(m)) {
      const where = [];
      if (norm(c.title + ' ' + c.premise + ' ' + c.summary).includes(nq)) where.push(snip([c.title, c.premise, c.summary].join(' · ')));
      (c.panels || []).forEach((p, i) => { const t = [p.description, ...(p.characters || []), ...(p.dialogues || []).map(d => d.who + ': ' + d.text)].join(' · '); if (norm(t).includes(nq)) where.push(`Panel ${i + 1}: ${snip(t)}`); });
      if (where.length) hits.push({ to: mlink(m, 'cap', c.id), label: `📖 Cap ${c.number}: <b>${esc(c.title || '')}</b>`, s: where.slice(0, 3).join('<br>') + (where.length > 3 ? `<br><span class="dim">+${where.length - 3} más</span>` : '') });
    }
    for (const f of m.canon) if (norm([f.entity, f.attribute, f.value].join(' ')).includes(nq)) hits.push({ to: mlink(m, 'canon'), label: '📌 Ficha canon', s: snip(`${f.entity} · ${f.attribute} · ${f.value}${f.since ? ' · desde Cap ' + f.since : ''}`) });
    if (hits.length) groups.push({ m, hits });
  }
  const total = groups.reduce((a, g) => a + g.hits.length, 0);
  return `<div class="head"><div><h1>🔎 "${esc(q)}"</h1><p class="muted">${total ? `${plural(total, 'resultado', 'resultados')} en ${plural(groups.length, 'manhwa', 'manhwas')}` : 'Sin resultados.'}</p></div></div>
    ${groups.map(g => `<div class="sect"><h2>${esc(g.m.name)}${g.m.archived ? ' <span class="chip warn">archivado</span>' : ''}</h2><div class="col">${g.hits.map(h => `<div class="res" data-a="go" data-to="${h.to}"><div>${h.label}</div>${h.s ? `<div class="small muted" style="margin-top:4px">${h.s}</div>` : ''}</div>`).join('')}</div></div>`).join('')}`;
};

function similarity(a, b) { const A = new Set(norm(a).split(' ').filter(w => w.length > 3)), Bs = new Set(norm(b).split(' ').filter(w => w.length > 3)); if (!A.size || !Bs.size) return 0; let i = 0; A.forEach(w => Bs.has(w) && i++); return i / Math.min(A.size, Bs.size); }

function charByName(m, n) { const k = norm(n); return m.characters.find(c => norm(c.name) === k || (c.nickname && norm(c.nickname) === k)); }
function buildPanelPrompt(m, p) {
  const st = m.bible.style; const chars = (p.characters || []).map(n => charByName(m, n)).filter(Boolean);
  const loras = []; const parts = [];
  if (st.prefix) parts.push(st.prefix);
  chars.forEach(c => {
    const look = c.visualPrompt || c.appearance || '';
    parts.push([c.trigger, look ? `(${c.name}: ${look})` : c.name].filter(Boolean).join(' '));
    if (c.loraId) loras.push({ path: c.loraId, scale: Number(c.loraWeight) || 0.9 });
  });
  parts.push(p.prompt_en || p.description || '');
  if (p.shot) parts.push(p.shot);
  const ratio = SIZE_H[p.size] || 1.4;
  const width = Number(st.width) || 800;
  const height = Math.round(Math.min(2048, width * ratio) / 8) * 8;
  return { prompt: p.promptOverride || parts.filter(Boolean).join(', '), negative: st.negative || '', loras, width, height, steps: Number(st.steps) || 30, cfg: Number(st.cfg) || 7 };
}

function directorSizes(c) {
  const t = c.tone; const ps = c.panels;
  ps.forEach((p, i) => {
    const hit = (p.sfx || []).length > 0 || /golpe|impacto|explot|corta|ataque|choque|cae|grita/i.test(p.description);
    if (t === 'pelea') p.size = hit ? 'L' : (i % 3 === 2 ? 'L' : 'S');
    else if (t === 'drama' || t === 'romance') p.size = (p.dialogues || []).some(d => d.type === 'pensamiento' || d.type === 'narracion') ? 'XL' : 'L';
    else if (t === 'misterio') p.size = i % 4 === 3 ? 'XL' : 'M';
    else if (t === 'comedia') p.size = hit ? 'M' : 'S';
  });
  if (ps.length) ps[ps.length - 1].size = ps[ps.length - 1].size === 'S' ? 'L' : ps[ps.length - 1].size;
}

/* Continuidad local: muertos que aparecen vivos */
function localDeadCheck(m, c) {
  const out = [];
  const dead = m.canon.filter(f => /estado|vida|vivo|muert/i.test(f.attribute) && /muert|fallec|asesinad|murio|murió/i.test(f.value) && Number(f.since) && Number(f.since) < Number(c.number));
  for (const f of dead) {
    const n = norm(f.entity);
    const idx = (c.panels || []).findIndex(p => (p.characters || []).some(x => norm(x) === n) || (p.dialogues || []).some(d => norm(d.who) === n));
    if (idx >= 0 && !(c.panels[idx].description || '').match(/recuerdo|flashback|fantasma|sueño|visión/i)) out.push(`${f.entity} murió en el Cap ${f.since} y aparece en el panel ${idx + 1} de este Cap ${c.number}. Si es un recuerdo, escribe “flashback” en la descripción.`);
  }
  m.characters.filter(ch => ch.status === 'muerto').forEach(ch => {
    if (dead.some(f => norm(f.entity) === norm(ch.name))) return;
    const idx = (c.panels || []).findIndex(p => (p.dialogues || []).some(d => norm(d.who) === norm(ch.name)));
    if (idx >= 0) out.push(`${ch.name} está marcado como muerto en su ficha y habla en el panel ${idx + 1}.`);
  });
  return out;
}

const DTYPE_WORDS = { pensando: 'pensamiento', pensamiento: 'pensamiento', piensa: 'pensamiento', grita: 'grito', gritando: 'grito', grito: 'grito', susurra: 'susurro', susurrando: 'susurro', susurro: 'susurro', narración: 'narracion', narracion: 'narracion' };
function parseManualScript(m, text) {
  const panels = []; let curP = null;
  const head = /^\s*(?:#+\s*)?(?:panel|vi[ñn]eta|cuadro|escena|p)\s*\.?\s*(\d+)\s*[:.\-)\]]?\s*(.*)$/i;
  const newP = () => { curP = mkPanel(); panels.push(curP); return curP; };
  for (const raw of String(text).split('\n')) {
    const l = raw.trim(); if (!l) continue;
    let mm;
    if ((mm = l.match(head))) { newP(); if (mm[2]) curP.description = mm[2].trim(); continue; }
    if (/^[-=*_]{3,}$/.test(l)) { newP(); continue; }
    const p = curP || newP();
    if ((mm = l.match(/^(?:sfx|efectos?|sonidos?|onomatopeyas?)\s*[:\-]\s*(.+)$/i))) { p.sfx.push(...mm[1].split(/[,/]/).map(x => x.trim().replace(/^["“]|["”]$/g, '')).filter(Boolean)); continue; }
    if ((mm = l.match(/^(?:tama[ñn]o|size)\s*[:\-]\s*(xl|l|m|s)\b/i))) { p.size = mm[1].toUpperCase(); continue; }
    if ((mm = l.match(/^(?:plano|shot|c[aá]mara)\s*[:\-]\s*(.+)$/i))) { p.shot = mm[1]; continue; }
    if ((mm = l.match(/^(?:prompt|prompt en ingl[eé]s)\s*[:\-]\s*(.+)$/i))) { p.prompt_en = mm[1]; continue; }
    if ((mm = l.match(/^(?:personajes?)\s*[:\-]\s*(.+)$/i))) { p.characters = mm[1].split(/[,y]/).map(x => x.trim()).filter(Boolean); continue; }
    if ((mm = l.match(/^(?:descripci[oó]n|desc|acci[oó]n|imagen|se ve)\s*[:\-]\s*(.+)$/i))) { p.description = (p.description ? p.description + ' ' : '') + mm[1]; continue; }
    if ((mm = l.match(/^(?:narraci[oó]n|narrador|cuadro de texto)\s*[:\-]\s*(.+)$/i))) { p.dialogues.push({ who: 'Narración', type: 'narracion', text: mm[1].replace(/^["“]|["”]$/g, '') }); continue; }
    if ((mm = l.match(/^([A-ZÁÉÍÓÚÑa-záéíóúñ][\wÁÉÍÓÚÑáéíóúñ' .]{0,24}?)\s*(?:\(([^)]+)\))?\s*:\s*(.+)$/))) {
      const tw = norm(mm[2] || ''); const type = Object.entries(DTYPE_WORDS).find(([k]) => tw.includes(norm(k)))?.[1] || (/^¡.*!$/.test(mm[3].trim()) && mm[3].length < 30 ? 'grito' : 'normal');
      p.dialogues.push({ who: mm[1].trim(), type, text: mm[3].trim().replace(/^["“—–-]\s*|["”]$/g, '') }); continue;
    }
    if ((mm = l.match(/^[—–]\s*(.+)$/))) { p.dialogues.push({ who: '', type: 'normal', text: mm[1] }); continue; }
    p.description = (p.description ? p.description + ' ' : '') + l;
  }
  // detectar personajes conocidos
  for (const p of panels) {
    const set = new Set(p.characters);
    p.dialogues.forEach(d => { const ch = charByName(m, d.who); if (ch) set.add(ch.name); });
    m.characters.forEach(ch => { if (ch.name && norm(p.description).split(' ').includes(norm(ch.name))) set.add(ch.name); });
    p.characters = [...set];
  }
  return panels.filter(p => p.description || p.dialogues.length || p.sfx.length);
}

function guessGender(v) { if (MALE.test(v.name)) return 'm'; if (FEMALE.test(v.name)) return 'f'; return '?'; }

const Reader = {
  paras: [], idx: 0, char: 0, playing: false, paused: false, key: '', utt: null, chunks: [], ci: 0, chunkStart: 0, token: 0,
  stop(silent) { this.token++; this.playing = false; this.paused = false; try { speechSynthesis.cancel(); } catch (e) { } if (!silent) this.ui(); },

  pickVoice() {

  splitChunks(t) { const out = []; let s = 0; const re = /[^.!?¡¿…\n]+[.!?…]*["»”]?\s*/g; let m; let buf = '', bufStart = 0; while ((m = re.exec(t))) { if (!buf) bufStart = m.index; if ((buf + m[0]).length > 220 && buf) { out.push({ text: buf, start: bufStart }); buf = m[0]; bufStart = m.index; } else buf += m[0]; } if (buf) out.push({ text: buf, start: bufStart }); return out.length ? out : [{ text: t, start: 0 }]; },

/* -------- Construir textos -------- */
function novelParas(m) {
  const out = [];
  for (const c of chapterList(m)) {
    const sec = `Cap ${c.number}`;
    out.push({ sec, head: `Capítulo ${c.number}${c.title ? ': ' + c.title : ''}`, text: `Capítulo ${c.number}. ${c.title || ''}.`, isHead: true });
    if (c.novel) c.novel.split(/\n\s*\n|\n/).map(s => s.trim()).filter(Boolean).forEach(t => out.push({ sec, text: t }));
    else if (c.panels?.length) {
      for (const p of c.panels) {
        const parts = [];
        if (p.description) parts.push(p.description.trim().replace(/([^.!?])$/, '$1.'));
        for (const d of p.dialogues || []) {
          if (!d.text) continue;
          if (d.type === 'narracion' || /narraci/i.test(d.who)) parts.push(d.text);
          else if (d.type === 'pensamiento') parts.push(`«${d.text}», pensó ${d.who}.`);

async function toJpegUnder(canvas, q, max) {
  let b = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
  while (max && b.size > max && q > 0.4) { q -= 0.07; b = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q)); }
  return b;
}
async function exportChapter(m, c, kind, lang, prog) {
  const E = EXPORTS[kind]; const items = c.layout.items; const base = `${safeName(m.name)}_cap${c.number}_${lang}`;
  const zip = new JSZip();
  if (kind === 'tiktok') {
    for (let i = 0; i < items.length; i++) {
      prog(`Imagen ${i + 1}/${items.length}…`);
      const src = await renderItem(m, items[i], WORK_W, lang, c.layout.bg);
      const cv = document.createElement('canvas'); cv.width = E.W; cv.height = E.H; const x = cv.getContext('2d');
      x.fillStyle = '#0b0b0f'; x.fillRect(0, 0, E.W, E.H);
      const s = Math.min(E.W / src.width, (E.H * 0.86) / src.height); const w = src.width * s, h = src.height * s;
      x.imageSmoothingQuality = 'high'; x.drawImage(src, (E.W - w) / 2, (E.H - h) / 2, w, h);
      x.fillStyle = 'rgba(255,255,255,.75)'; x.font = '700 34px Inter, sans-serif'; x.textAlign = 'center'; x.fillText(`${m.name} · Cap ${c.number}`, E.W / 2, E.H - 60);
      zip.file(`${String(i + 1).padStart(3, '0')}.jpg`, await toJpegUnder(cv, E.q, 0));
    }
    prog('Comprimiendo…'); downloadBlob(await zip.generateAsync({ type: 'blob' }), `${base}_tiktok.zip`); prog(`✔ ${items.length} imágenes 1080×1920 listas para TikTok.`); return;
  }
  // layout total en px de salida
  const W = E.W; const k = W / WORK_W;
  const pos = []; let y = 0;
  for (const it of items) { const h = itemHeightAt(m, it, W); pos.push({ it, y, h }); y += h + Math.round((it.gap ?? 80) * k); }
  const totalH = Math.max(1, y - Math.round((items[items.length - 1].gap ?? 80) * k));
  const nSlices = Math.ceil(totalH / E.H);
  const cache = new Map();
  const getItem = async it => { if (!cache.has(it.id)) { if (cache.size > 2) cache.delete(cache.keys().next().value); cache.set(it.id, await renderItem(m, it, WORK_W, lang, c.layout.bg)); } return cache.get(it.id); };
  const slices = [];
  for (let s = 0; s < nSlices; s++) {
    prog(`Armando imagen ${s + 1}/${nSlices}…`);
    const top = s * E.H, h = Math.min(E.H, totalH - top);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = h; const x = cv.getContext('2d'); x.imageSmoothingQuality = 'high';
    x.fillStyle = c.layout.bg; x.fillRect(0, 0, W, h);
    for (const p of pos) {
      if (p.y + p.h <= top || p.y >= top + h) continue;
      const src = await getItem(p.it); const sk = src.width / W; // src está a 1600
      const sy0 = Math.max(0, top - p.y), sy1 = Math.min(p.h, top + h - p.y);
      // altura real del render puede variar ligeramente
      const ratio = src.height / p.h;
      x.drawImage(src, 0, sy0 * ratio, src.width, (sy1 - sy0) * ratio, 0, p.y + sy0 - top, W, sy1 - sy0);
    }
    slices.push(cv);
  }
  if (kind === 'pdf') {
    prog('Creando PDF…');
    const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit: 'px', format: [W, E.H], hotfixes: ['px_scaling'] });
    for (let i = 0; i < slices.length; i++) { if (i) pdf.addPage([W, slices[i].height]); const b = await toJpegUnder(slices[i], E.q, 0); const d = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); pdf.addImage(d, 'JPEG', 0, 0, W, slices[i].height); }
    downloadBlob(pdf.output('blob'), `${base}.pdf`); prog(`✔ PDF de ${slices.length} páginas.`); return;
  }
  let total = 0;
  for (let i = 0; i < slices.length; i++) { prog(`Comprimiendo ${i + 1}/${slices.length}…`); const b = await toJpegUnder(slices[i], E.q, E.max); total += b.size; zip.file(`${String(i + 1).padStart(3, '0')}.jpg`, b); }
  const warn = []; if (E.maxN && slices.length > E.maxN) warn.push(`son ${slices.length} imágenes y el límite es ${E.maxN}`); if (E.maxTotal && total > E.maxTotal) warn.push(`pesan ${(total / 1e6).toFixed(1)}MB y el límite es ${E.maxTotal / 1e6}MB (divide el capítulo en dos episodios)`);
  downloadBlob(await zip.generateAsync({ type: 'blob' }), `${base}_${kind}.zip`);
  prog(`✔ ${slices.length} imágenes de ${W}×${E.H} · ${(total / 1e6).toFixed(1)}MB en total.${warn.length ? ' ⚠ Ojo: ' + warn.join('; ') + '.' : ''}`);
}

  for (const l of lines) { x.strokeText(l, W / 2, y); x.fillText(l, W / 2, y); y += fs * 1.02; }
  x.shadowBlur = 0; x.font = `800 ${subFs}px Inter, sans-serif`; x.fillStyle = cv.accent; x.fillText((cv.sub || '').toUpperCase(), W / 2, y + subFs * 0.5);
}

const SHEET_SLOTS = [['front', 'Frente', 'full body, front view, standing, neutral pose'], ['profile', 'Perfil', 'full body, side view profile, standing'], ['back', 'Espalda', 'full body, back view, from behind'],

function imgLine(n, w, h, label) { const mp = Math.max(1, Math.ceil(w * h / 1e6)); const app = S.settings.falApp || 'fal-ai/flux-lora'; return { label: label || `${plural(n, 'imagen', 'imágenes')} ${w}×${h} en Fal.ai`, cost: costImages(n, w, h), note: `${money(falUnit(app))} por megapíxel · ${mp} MP c/u${app === 'fal-ai/lora' ? ' · precio aproximado para Pony/SDXL' : ''}` }; }

function falRequest(m, o) {
  if (o.worker) return workerReq(o.worker, o);
  let { prompt, negative = '', loras = [], width, height, seed, steps, cfg } = o;
  const app = S.settings.falApp || 'fal-ai/flux-lora';
  const st = m.bible.style;
  width = Math.round((width || st.width || 800) / 8) * 8; height = Math.round((height || st.height || 1200) / 8) * 8;
  const common = { prompt, image_size: { width, height }, num_images: 1, seed, loras: loras.filter(l => l.path), enable_safety_checker: true };
  if (app === 'fal-ai/lora') {
    if (!S.settings.sdxlModel) throw new Error('Elegiste SDXL/Pony: escribe en Configuración el modelo (repo de Hugging Face o URL del checkpoint).');
    return { app, input: { ...common, model_name: S.settings.sdxlModel, negative_prompt: negative, num_inference_steps: steps || st.steps || 30, guidance_scale: cfg || st.cfg || 7, prompt: (S.settings.ponyPrefix ?? 'score_9, score_8_up, score_7_up, ') + prompt } };
  }
  return { app, input: { ...common, num_inference_steps: Math.min(50, steps || 28), guidance_scale: 3.5, output_format: 'jpeg' } };
}
/* genera N imágenes con semillas propias (para poder repetir cualquiera) */
async function falGenerate(m, opts, n = 1, meta = {}, { confirmed = false, title = 'Generar imágenes en Fal.ai' } = {}) {
  const st0 = m.bible.style; const W0 = opts.width || st0.width || 800, H0 = opts.height || st0.height || 1200;
  const k = opts.worker || null; const one = k ? wkCost(k, 1, opts) : costImages(1, W0, H0);
  if (!confirmed && !(k ? await confirmWorker(k, n, { res: opts.res, noun: opts.noun ? plural(n, ...opts.noun) : null }) : await confirmCost(title, [imgLine(n, W0, H0)]))) throw new Error('Cancelado');
  const seeds = Array.from({ length: n }, (_, i) => opts.seed != null ? opts.seed + i : randSeed());
  const runs = seeds.map(async seed => {
    const req = falRequest(m, { ...opts, seed });
    const r = await callFn('falRun', { app: req.app, input: req.input, manhwaId: m.id });
    const im = r.images?.[0]; if (!im) throw new Error('Fal.ai no devolvió imagen');
    if (r.has_nsfw_concepts?.[0]) toast('Fal.ai marcó una imagen como sensible y puede venir en negro.', 'err');
    const settings = { app: req.app, worker: k, width: req.input.image_size?.width ?? null, height: req.input.image_size?.height ?? null, resolution: req.input.resolution || (k ? '1k' : null), aspect: req.input.aspect_ratio || null, steps: req.input.num_inference_steps, cfg: req.input.guidance_scale, loras: req.input.loras, model: req.input.model_name || null };
    return addRemoteImage(m, im, { seed: r.seed ?? (k === 'artista' ? null : seed), prompt: opts.prompt, negative: opts.negative || '', settings, ...meta });
  });
  const res = await Promise.allSettled(runs);
  const ok = res.filter(x => x.status === 'fulfilled').map(x => x.value);
  const bad = res.find(x => x.status === 'rejected');
  if (ok.length) { addSpend(one * ok.length); addFalSpend(one * ok.length, m, meta.chapter); }
  if (ok.length && !opts.quiet) afterSpend(m, one * ok.length, { chapterId: meta.chapter });
  if (!ok.length && bad) throw bad.reason;
  if (bad) toast('Una imagen falló: ' + bad.reason.message, 'err');
  return ok;
}

async function startTraining(m, ch, blobs) {
  if (!S.user) throw new Error('Inicia sesión para entrenar.');
  if (blobs.length < 10) throw new Error(`Solo hay ${blobs.length} imágenes. Usa al menos 10 (ideal 20-30).`);
  if (!ch.trigger) ch.trigger = norm(ch.name).replace(/\s/g, '') + 'mh';
  const steps = Number($('#trSteps')?.value) || S.settings.trainSteps || 1000;
  const who = wkOn() ? ($('#trWho')?.value || S.settings.trWho || 'maestro') : null; if (who) { S.settings.trWho = who; saveSettings(); }
  if (who ? !await confirmWorker(who, 1, { steps, extra: `Le enseño a ${esc(ch.name)} con ${blobs.length} fotos. Tarda unos minutos y te aviso cuando termine.${who === 'maestroClasico' ? '<br>⚠️ Lo que enseña El Maestro Clásico no lo entiende El Obrero: sus paneles costarán ' + mx(0.035) + ' cada uno.' : ''}` }) : !await confirmCost('Entrenar LoRA en Fal.ai', [{ label: `Entrenamiento de ${ch.name} · ${blobs.length} imágenes · ${steps} pasos`, cost: costTrain(steps), note: `${money(falUnit(S.settings.trainApp || 'fal-ai/flux-lora-fast-training'))} por cada 1000 pasos` }])) throw new Error('Cancelado');
  const zip = new JSZip(); const cap = `${ch.trigger}, ${ch.visualPrompt || ch.appearance || ch.name}`;
  blobs.forEach((b, i) => { const n = String(i + 1).padStart(3, '0'); zip.file(`${n}.${(b.type || '').includes('png') ? 'png' : 'jpg'}`, b); zip.file(`${n}.txt`, cap); });
  const zb = await zip.generateAsync({ type: 'blob' });
  const path = `${S.user.id}/${m.id}/datasets/${ch.id}_${Date.now()}.zip`;
  const up = await sb.storage.from('studio').upload(path, zb, { contentType: 'application/zip' }); if (up.error) throw up.error;
  const { data: sg, error } = await sb.storage.from('studio').createSignedUrl(path, 60 * 60 * 24); if (error) throw error;
  const app = who ? WK[who].app : (S.settings.trainApp || 'fal-ai/flux-lora-fast-training');
  const input = who === 'maestro' ? { images_data_url: sg.signedUrl, steps, resolution: 1024 } : { images_data_url: sg.signedUrl, trigger_word: ch.trigger, steps, create_masks: true };
  const r = await callFn('falSubmit', { app, input });
  const tc = who ? wkCost(who, 1, { steps }) : costTrain(steps); addSpend(tc); addFalSpend(tc, m); afterSpend(m, tc, { label: 'en enseñarle a ' + ch.name });
  ch.training = { request_id: r.request_id, status_url: r.status_url, response_url: r.response_url, status: 'IN_QUEUE', startedAt: Date.now(), app, n: blobs.length, dataset: path };
  (ch.history ||= []).push({ at: Date.now(), change: `Entrenamiento LoRA v${(ch.loraVersion || 0) + 1} enviado con ${blobs.length} imágenes` });
  touch(m); S.settings.trainSteps = steps; saveSettings();
  toast('Entrenamiento enviado a Fal.ai ⏳ Te aviso cuando termine.', 'ok');
  pollTraining(m.id, ch.id);
}

const polling = new Set();
async function pollTraining(mid, cid) {
  const key = mid + cid; if (polling.has(key)) return; polling.add(key);
  try {
    while (true) {
      const m = S.manhwas[mid]; const ch = m?.characters.find(c => c.id === cid); const tr = ch?.training;
      if (!tr || ['COMPLETED', 'FAILED'].includes(tr.status) || !S.user) break;
      try {
        const st = await callFn('falStatus', { status_url: tr.status_url });
        tr.status = st.status || tr.status; tr.queue = st.queue_position ?? null;
        if (st.status === 'COMPLETED') {
          const res = await callFn('falResult', { response_url: tr.response_url });
          const url = res.diffusers_lora_file?.url || res.lora_file?.url;
          if (!url) { tr.status = 'FAILED'; tr.error = res.error || 'Sin archivo LoRA'; }
          else { ch.loraId = url; ch.loraBase = /klein/.test(tr.app || '') ? 'klein' : 'flux1'; ch.loraVersion = (ch.loraVersion || 0) + 1; tr.doneAt = Date.now(); tr.lora = url; (ch.history ||= []).push({ at: Date.now(), change: `LoRA v${ch.loraVersion} entrenado y activado automáticamente` }); toast(`🎉 LoRA v${ch.loraVersion} de ${ch.name} listo y conectado`, 'ok'); if (S.user && tr.dataset) sb.storage.from('studio').remove([tr.dataset]).catch(() => { }); }
          touch(m); if (Route.view === 'lora') render(); break;
        }
        touch(m); if (Route.view === 'lora' && Route.a === cid) render();
      } catch (e) { if (/no válida|desconocida/.test(e.message)) { tr.status = 'FAILED'; tr.error = e.message; touch(m); break; } }
      await sleep(20000);
    }
  } finally { polling.delete(key); }
}

function resumeTrainings() { for (const m of Object.values(S.manhwas)) for (const ch of m.characters || []) if (ch.training && !['COMPLETED', 'FAILED'].includes(ch.training.status)) pollTraining(m.id, ch.id); }

/* ---------- Borrador de fondo MANUAL (sin IA): pincel, restaurar y varita mágica ---------- */
async function openEraser(m, blob) {
  if (!blob) return toast('No encontré la imagen', 'err');
  const src = await createImageBitmap(blob); const MAXD = 1400; const k = Math.min(1, MAXD / Math.max(src.width, src.height));
  const W = Math.round(src.width * k), H = Math.round(src.height * k);
  const orig = document.createElement('canvas'); orig.width = W; orig.height = H; orig.getContext('2d').drawImage(src, 0, 0, W, H);
  const bg = modal(`<div class="row between"><h2>🧽 Borrar fondo a mano → sticker PNG</h2><button class="sm" data-x="close">Cerrar</button></div>
    <div class="row">
      <button class="sm pri" data-tool="erase">🧽 Borrador</button><button class="sm" data-tool="restore">🖌️ Restaurar</button><button class="sm" data-tool="wand">🪄 Varita (borra un color parecido)</button>
      <label class="f" style="width:150px">Pincel <input type="range" id="erSize" min="4" max="160" value="40"></label>
      <label class="f" style="width:150px">Tolerancia varita <input type="range" id="erTol" min="5" max="120" value="40"></label>
      <button class="sm" data-x="undo">↶ Deshacer</button><button class="sm" data-x="zoomin">🔍＋</button><button class="sm" data-x="zoomout">🔍－</button>
    </div>
    <div id="erWrap" style="max-height:62vh;overflow:auto;border-radius:12px;background:repeating-conic-gradient(#3a3a42 0 25%,#26262c 0 50%) 0 0/20px 20px;touch-action:none"><canvas id="erC" width="${W}" height="${H}" style="display:block;width:100%;cursor:crosshair;touch-action:none"></canvas></div>
    <p class="tiny dim">Consejo: usa la varita en el fondo liso y luego el borrador para los detalles. “Restaurar” devuelve lo que borraste de más.</p>
    <div class="acts"><button data-x="close2">Cancelar</button><button class="pri" data-x="save">💾 Guardar como sticker PNG</button></div>`, { wide: true });
  const cv = bg.querySelector('#erC'); const ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.drawImage(orig, 0, 0);
  let tool = 'erase', zoom = 1; const undo = [];
  const pushU = () => { undo.push(ctx.getImageData(0, 0, W, H)); if (undo.length > 15) undo.shift(); };
  bg.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => { tool = b.dataset.tool; bg.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('pri', x === b)); });
  bg.querySelector('[data-x=undo]').onclick = () => { const d = undo.pop(); if (d) ctx.putImageData(d, 0, 0); };
  const setZoom = z => { zoom = Math.min(4, Math.max(1, z)); cv.style.width = (zoom * 100) + '%'; };
  bg.querySelector('[data-x=zoomin]').onclick = () => setZoom(zoom * 1.4); bg.querySelector('[data-x=zoomout]').onclick = () => setZoom(zoom / 1.4);
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  const brush = (x0, y0, x1, y1) => {
    const size = +bg.querySelector('#erSize').value * (W / cv.getBoundingClientRect().width);
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = size;
    if (tool === 'erase') { ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.strokeStyle = '#000'; const mask = document.createElement('canvas'); mask.width = W; mask.height = H; const mc = mask.getContext('2d'); mc.lineCap = 'round'; mc.lineWidth = size; mc.beginPath(); mc.moveTo(x0, y0); mc.lineTo(x1, y1); mc.stroke(); mc.globalCompositeOperation = 'source-in'; mc.drawImage(orig, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(mask, 0, 0); }
    ctx.restore();
  };
  const wand = (x, y) => {
    x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= W || y >= H) return;
    const id = ctx.getImageData(0, 0, W, H), d = id.data; const tol = +bg.querySelector('#erTol').value; const i0 = (y * W + x) * 4;
    const r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2]; if (d[i0 + 3] === 0) return;
    const seen = new Uint8Array(W * H); const st = [y * W + x]; const t2 = tol * tol * 3;
    while (st.length) { const p = st.pop(); if (seen[p]) continue; seen[p] = 1; const j = p * 4; if (d[j + 3] === 0) continue; const dr = d[j] - r0, dg = d[j + 1] - g0, db = d[j + 2] - b0; if (dr * dr + dg * dg + db * db > t2) continue; d[j + 3] = 0; const px = p % W; if (px > 0) st.push(p - 1); if (px < W - 1) st.push(p + 1); if (p >= W) st.push(p - W); if (p < W * (H - 1)) st.push(p + W); }
    ctx.putImageData(id, 0, 0);
  };
  let drawing = false, last = null;
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); pushU(); if (tool === 'wand') { wand(x, y); return; } drawing = true; last = [x, y]; brush(x, y, x + 0.1, y + 0.1); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pos(e); brush(last[0], last[1], x, y); last = [x, y]; });
  const end = () => { drawing = false; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  const close = () => bg.remove(); bg.querySelector('[data-x=close]').onclick = close; bg.querySelector('[data-x=close2]').onclick = close;
  bg.querySelector('[data-x=save]').onclick = async () => {
    const id = ctx.getImageData(0, 0, W, H).data; let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (id[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) return toast('Borraste todo 😅', 'err');
    const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1; out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    const png = await new Promise(r => out.toBlob(r, 'image/png'));
    const sid = await addImage(m, new File([png], 'sticker.png', { type: 'image/png' }), { source: 'sticker', sticker: true, name: 'Recorte' });
    close();
    if (Route.view === 'armador') {
      const c = chapterById(m, Route.a); const it = c?.layout.items.find(i => i.id === BSEL.item);
      if (it && await confirmBox('Sticker guardado ✔ ¿Ponerlo en el panel actual?', { ok: 'Sí, ponerlo', danger: false, title: '🏷️ Sticker listo' })) { let L; editLayout(c, () => { L = addStickerLayer(m, c, it, sid, { fg: true }); }); BSEL.layer = L.id; touch(m); }
      render();
    } else toast('Sticker guardado ✔', 'ok');
  };
}
ACT.bEraser = async () => { const m = cur(); const c = chapterById(m, Route.a); const it = c.layout.items.find(i => i.id === BSEL.item); if (!it?.imgId) return; openEraser(m, await getImageBlob(m, it.imgId)); };

/* ---------- Checklist antes de publicar ---------- */
function chapterChecklist(m, c, lang = 'es') {
  const out = []; const items = c.layout?.items || [];
  const add = (ok, text, go = null, level = ok ? 'ok' : 'warn') => out.push({ ok, text, go, level });
  add(items.length > 0, items.length ? `${plural(items.length, 'panel', 'paneles')} en el capítulo` : 'El capítulo no tiene paneles', null, items.length ? 'ok' : 'bad');
  if (!items.length) return out;
  const noText = items.map((x, i) => ({ x, i })).filter(({ x }) => x.imgId && !x.layers.some(l => l.kind !== 'sticker' && layerText(l, lang).trim()));
  add(!noText.length, noText.length ? `Paneles sin texto: ${noText.map(o => o.i + 1).join(', ')} (puede ser a propósito)` : 'Todos los paneles con imagen tienen texto', noText[0]?.x.id);
  const placeholder = items.map((x, i) => ({ x, i })).filter(({ x }) => x.layers.some(l => /^texto…?$/i.test(layerText(l, 'es').trim()) || (l.kind !== 'sticker' && !layerText(l, 'es').trim())));
  add(!placeholder.length, placeholder.length ? `Hay globos vacíos o con “Texto…” en: ${placeholder.map(o => o.i + 1).join(', ')}` : 'Ningún globo vacío', placeholder[0]?.x.id, placeholder.length ? 'bad' : 'ok');
  if (lang !== 'es') { const miss = items.map((x, i) => ({ x, i })).filter(({ x }) => x.layers.some(l => l.kind !== 'sticker' && l.text && !(lang === 'en' ? l.text_en : l.text_ko))); add(!miss.length, miss.length ? `Faltan traducciones (${lang.toUpperCase()}) en: ${miss.map(o => o.i + 1).join(', ')}` : `Traducción ${lang.toUpperCase()} completa`, miss[0]?.x.id); }
  const out_ = items.map((x, i) => ({ x, i })).filter(({ x }) => x.layers.some(l => l.x < -0.04 || l.y < -0.04 || l.x + l.w > 1.04 || l.y + l.h > 1.04));
  add(!out_.length, out_.length ? `Capas que se salen del cuadro (se cortarán) en: ${out_.map(o => o.i + 1).join(', ')}` : 'Ninguna capa se sale del cuadro', out_[0]?.x.id);
  const small = items.map((x, i) => ({ x, i })).filter(({ x }) => x.imgId && (m.images[x.imgId]?.w || 9999) < 800);
  add(!small.length, small.length ? `Imágenes chicas (menos de 800px, se verán borrosas): ${small.map(o => o.i + 1).join(', ')}` : 'Todas las imágenes tienen buen tamaño (800px o más)', small[0]?.x.id);
  const missing = items.map((x, i) => ({ x, i })).filter(({ x }) => x.imgId && !m.images[x.imgId]);
  add(!missing.length, missing.length ? `Imágenes que ya no existen: ${missing.map(o => o.i + 1).join(', ')}` : 'Todas las imágenes están disponibles', missing[0]?.x.id, missing.length ? 'bad' : 'ok');
  add(!!m.covers?.img, m.covers?.img ? 'Portada lista (con y sin título, 1080×1080 y 1080×1920)' : 'Falta la portada', 'portada');
  add(!!(c.title || '').trim(), (c.title || '').trim() ? `Título: “${c.title}”` : 'El capítulo no tiene título');
  const h = items.reduce((a, x) => a + itemHeightAt(m, x, 800) + Math.round((x.gap ?? 80) * 0.5), 0); const slices = Math.ceil(h / 1280);
  add(slices <= 100, `Tamaño WEBTOON: 800px de ancho, ${slices} imágenes de 800×1280${slices > 100 ? ' — pasa el límite de 100, divide en 2 episodios' : ''}`, null, slices > 100 ? 'bad' : 'ok');
  add(['Listo', 'Publicado'].includes(c.status), `Estado del capítulo: ${c.status}${['Listo', 'Publicado'].includes(c.status) ? '' : ' (márcalo como Listo cuando termines)'}`);
  return out;
}
ACT.bChecklist = () => {
  const m = cur(); const c = chapterById(m, Route.a); let lang = BSEL.lang;
  const show = () => {

      <div class="alert ${bad ? 'warn' : 'ok'}">${bad ? `Faltan ${plural(bad, 'cosa', 'cosas')} por revisar.` : '¡Todo listo para publicar! 🎉'}</div>
      <div class="col" style="gap:8px">${list.map(x => `<div class="row nw between"><div class="small">${x.level === 'ok' ? '✅' : x.level === 'bad' ? '⛔' : '⚠️'} ${esc(x.text)}</div>${x.go ? `<button class="sm" data-goto="${esc(x.go)}">Ir</button>` : ''}</div>`).join('')}</div>

};

/* ---------- Traducir capítulo (todas las capas, sin tocar imágenes) ---------- */
ACT.bTranslate = async () => {
  const m = cur(); const c = chapterById(m, Route.a);
  const target = await choiceBox('🌐 Traducir capítulo', 'Traduzco todos los globos, textos y SFX. Las imágenes no se tocan.', [{ label: 'Inglés', value: 'en' }, { label: 'Coreano', value: 'ko' }, { label: 'Ambos', value: 'both', cls: 'pri' }]);
  if (!target) return;
  const items = []; c.layout.items.forEach((x, i) => x.layers.forEach(L => { if (L.kind !== 'sticker' && (L.text || '').trim()) items.push({ k: `${x.id}|${L.id}`, text: L.text, sfx: L.kind === 'sfx' }); }));
  if (!items.length) return toast('No hay textos que traducir', 'err');
  const langs = target === 'both' ? 'INGLÉS ("en") y COREANO ("ko")' : target === 'en' ? 'INGLÉS ("en")' : 'COREANO ("ko")';
  const per = isPremium() ? 1000 : 80;
  if (!isPremium() && !await confirmCost('Traducir capítulo', [aiLine(JSON.stringify(items).length + 500, items.length * 40, 6000, `${items.length} textos`)])) return;
  const btn = $('[data-a=bTranslate]');
  await busy(btn, async () => {
    const out = {};
    for (let a = 0; a < items.length; a += per) {
      const chunk = items.slice(a, a + per);
      const r = await aiJSON(`Traduce estos textos de manhwa (globos y efectos de sonido) a ${langs}. Tono natural de webtoon. Los SFX ("sfx":true) tradúcelos como onomatopeyas nativas (BOOM → 쾅 en coreano). Mantén la "k" de cada uno.
${JSON.stringify(chunk)}
Formato: [{"k":"…"${target !== 'ko' ? ',"en":"…"' : ''}${target !== 'en' ? ',"ko":"…"' : ''}}]`, { max_tokens: Math.min(32000, chunk.length * 120 + 500), temperature: 0.3, confirmed: true, title: 'Traducir capítulo' });
      (Array.isArray(r) ? r : []).forEach(x => out[x.k] = x);
    }
    editLayout(c, () => c.layout.items.forEach(x => x.layers.forEach(L => { const t = out[`${x.id}|${L.id}`]; if (t) { if (t.en) L.text_en = t.en; if (t.ko) L.text_ko = t.ko; } })));
    BSEL.lang = target === 'both' ? 'en' : target; touch(m); render(); toast('Capítulo traducido 🌐 Cambia el idioma con ES / EN / KO', 'ok');
  }, 'Traduciendo…');
};

/* =====================================================================
   HABLANDO: le dices qué cambiar (voz o texto) y se aplica en vivo.
   1) Intérprete local en español (gratis, instantáneo).
   2) Lo que no entienda → Claude Code (si está conectado) o Claude.
   Siempre con DESHACER.
   ===================================================================== */

      if (playing && el.paused) el.play().catch(() => { }); if (!playing && !el.paused) el.pause();

  }
  drawVisual(ctx, W, H, c, t, dt) {
    const local = t - c.start; const fx = c.fx || {};

    const p = local / 0.4; if (p < 1) { const e = ease(p); if (fx.enter === 'fade') alpha = e; else if (fx.enter === 'zoom') { sc = 1.2 - 0.2 * e; alpha = Math.min(1, p * 2); } else if (fx.enter === 'slide') dy = (1 - e) * H * 0.25; else if (fx.enter === 'slideL') dx = (1 - e) * W * 0.6; }

        if (!this.parts.has(c.id)) this.parts.set(c.id, makeParticles(itemAnim(it).particles, 3)); drawAnimItem(ctx, this.m, it, bmp, 0, H * 0.05, W, H * 0.9, local, c.dur, this.v.lang || 'es', '#ffffff', this.parts.get(c.id), { dt }); }
    } else {
      const src = c.kind === 'video' ? this.vid.get(c.media) : this.img.get(c.media);
      const sw = src?.videoWidth || src?.width, sh = src?.videoHeight || src?.height;
      if (src && sw) {
        const q = Math.min(1, local / Math.max(0.1, c.dur)); const kb = kbAt(fx.kb, q) || { z: 1 };

        if (fit === 'blur' && c.track === 'img') { if (CAN_FILTER) { ctx.save(); ctx.filter = 'blur(30px) brightness(50%)'; const k = Math.max(W / sw, H / sh) * 1.1; ctx.drawImage(src, (W - sw * k) / 2, (H - sh * k) / 2, sw * k, sh * k); ctx.restore(); } else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); } }
        const base = fit === 'cover' || c.track === 'broll' ? Math.max(W / sw, H / sh) : Math.min(W / sw, H / sh);
        const k = base * (kb.z || 1); const dw = sw * k, dh = sh * k;
        const ox = (W - dw) / 2 + (kb.x || 0) * (dw - W) * -1, oy = (H - dh) / 2 + (kb.y || 0) * (dh - H) * -1;
        if (fxOn(c.cfx) && CAN_FILTER) ctx.filter = `brightness(${c.cfx.b}%) contrast(${c.cfx.c}%) saturate(${c.cfx.s}%)`;

    }

  }
  drawText(ctx, W, H, c, t) {
    const local = t - c.start; const st = c.style || {}; const U = W;
    const L = mkLayer(st.kind || 'texto', { x: st.x ?? 0.08, y: st.y ?? 0.12, w: st.w ?? 0.84, h: st.h ?? 0.12 * (W / H) * 1.8, text: c.text || '', fs: (st.fs || 0.075), color: st.color || '#ffffff', stroke: st.stroke || '#000000', fill: st.fill || 'transparent', font: st.font || 'Montserrat', rot: st.rot || 0, bw: st.bw ?? 1.2 });
